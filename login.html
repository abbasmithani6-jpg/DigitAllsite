<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DigitAll | Log In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Stack+Sans+Notch:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0518;
    --card:#160b38;
    --card-border: rgba(255,255,255,0.08);
    --purple:#580CEB;
    --teal:#00F5A4;
    --red:#FF4D5E;
    --text:#FFFFFF;
    --text-dim:#B9AFDA;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-display: "Stack Sans Notch", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  *{ box-sizing: border-box; }
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background: radial-gradient(1200px 600px at 20% -10%, #1a0f45 0%, var(--bg) 55%) fixed, var(--bg);
    font-family: var(--font); color: var(--text); padding: 24px;
  }
  .card{
    width: 100%; max-width: 420px; background: var(--card); border: 1px solid var(--purple);
    border-radius: 24px; padding: 40px 36px;
  }
  .logo-row{ display:flex; align-items:center; gap:10px; margin-bottom: 28px; }
  .logo-row .word{ font-family: var(--font-display); font-weight:800; font-size: 20px; }
  .logo-row .word span{ color: var(--teal); }
  h1{ font-family: var(--font-display); font-size: 24px; margin: 0 0 6px; }
  p.sub{ color: var(--text-dim); font-size: 14px; margin: 0 0 28px; }
  label{ display:block; font-size: 13px; font-weight: 700; margin-bottom: 6px; color: var(--text-dim); }
  input{
    width:100%; background: rgba(255,255,255,0.04); border: 1px solid var(--card-border);
    color: var(--text); border-radius: 12px; padding: 13px 14px; font-size: 15px; margin-bottom: 18px;
    font-family: var(--font);
  }
  input:focus{ outline:none; border-color: var(--teal); }
  button{
    width:100%; background: var(--teal); color:#04160f; border:none; border-radius: 999px;
    padding: 14px; font-size: 15px; font-weight: 800; cursor:pointer; font-family: var(--font);
    transition: opacity .15s ease;
  }
  button:hover{ opacity: 0.9; }
  button:disabled{ opacity: 0.5; cursor: not-allowed; }
  .msg{ margin-top: 18px; font-size: 14px; line-height: 1.5; padding: 12px 14px; border-radius: 10px; display:none; }
  .msg.success{ display:block; background: rgba(0,245,164,0.1); border: 1px solid rgba(0,245,164,0.35); color: var(--teal); }
  .msg.error{ display:block; background: rgba(255,77,94,0.1); border: 1px solid rgba(255,77,94,0.35); color: var(--red); }
  .row-between{ display:flex; justify-content:flex-end; margin: -10px 0 20px; }
  .link-btn{
    background:none; border:none; color: var(--text-dim); font-size: 13px; font-weight: 600;
    text-decoration: underline; cursor:pointer; padding:0; width:auto; font-family: var(--font);
  }
  .link-btn:hover{ color: var(--teal); }
  .footer-note{ margin-top: 20px; text-align:center; font-size: 13px; color: var(--text-dim); }
</style>
</head>
<body>

<div class="card">
  <div class="logo-row">
    <div class="word">Digit<span>All</span></div>
  </div>

  <h1>Welcome back</h1>
  <p class="sub">Log in to your DigitAll account.</p>

  <form id="login-form">
    <label for="email">Email</label>
    <input type="email" id="email" required placeholder="you@example.com">

    <label for="password">Password</label>
    <input type="password" id="password" required placeholder="Your password">

    <div class="row-between">
      <button type="button" class="link-btn" id="forgot-btn">Forgot password?</button>
    </div>

    <button type="submit" id="submit-btn">Log In</button>
  </form>

  <div class="msg" id="msg"></div>

  <p class="footer-note">Don't have an account yet? Sign up first.</p>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getAuth,
    signInWithEmailAndPassword,
    sendPasswordResetEmail
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBc0-yyvbJH7gk5Fmh6-0u0AI6XTyqrdXU",
    authDomain: "digitall-c77d8.firebaseapp.com",
    projectId: "digitall-c77d8",
    storageBucket: "digitall-c77d8.firebasestorage.app",
    messagingSenderId: "922798712588",
    appId: "1:922798712588:web:43235136b5b1bf58168b29"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  const form = document.getElementById("login-form");
  const msgEl = document.getElementById("msg");
  const submitBtn = document.getElementById("submit-btn");
  const forgotBtn = document.getElementById("forgot-btn");
  const emailInput = document.getElementById("email");
  const passwordInput = document.getElementById("password");

  function showMessage(text, type) {
    msgEl.textContent = text;
    msgEl.className = "msg " + type;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    submitBtn.disabled = true;
    submitBtn.textContent = "Logging in...";

    const email = emailInput.value.trim();
    const password = passwordInput.value;

    try {
      const userCredential = await signInWithEmailAndPassword(auth, email, password);
      const user = userCredential.user;

      if (!user.emailVerified) {
        showMessage(
          "Please verify your email before logging in. Check your inbox for the verification link we sent when you signed up.",
          "error"
        );
      } else {
        showMessage(`Welcome back, ${email}! You're logged in.`, "success");
        // TODO: redirect to the main DigitAll dashboard (index.html) here, e.g.:
        // window.location.href = "index.html";
      }
    } catch (err) {
      let friendly = "Something went wrong. Please try again.";
      if (err.code === "auth/invalid-credential" || err.code === "auth/wrong-password") friendly = "Incorrect email or password.";
      if (err.code === "auth/user-not-found") friendly = "No account found with that email.";
      if (err.code === "auth/invalid-email") friendly = "That email address doesn't look valid.";
      if (err.code === "auth/too-many-requests") friendly = "Too many attempts. Please wait a moment and try again.";
      showMessage(friendly, "error");
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "Log In";
    }
  });

  forgotBtn.addEventListener("click", async () => {
    const email = emailInput.value.trim();
    if (!email) {
      showMessage("Enter your email above first, then tap Forgot password.", "error");
      return;
    }
    forgotBtn.disabled = true;
    try {
      await sendPasswordResetEmail(auth, email);
      showMessage(`Password reset link sent to ${email}. Check your inbox.`, "success");
    } catch (err) {
      let friendly = "Couldn't send reset email. Please try again.";
      if (err.code === "auth/user-not-found") friendly = "No account found with that email.";
      if (err.code === "auth/invalid-email") friendly = "That email address doesn't look valid.";
      showMessage(friendly, "error");
    } finally {
      forgotBtn.disabled = false;
    }
  });
</script>

</body>
</html>
