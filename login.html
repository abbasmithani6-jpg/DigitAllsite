<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In | DigitAll</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Stack+Sans+Notch:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style>
  .auth-wrapper {
    min-height: calc(100vh - 80px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }
  .auth-card {
    background: rgba(22, 11, 56, 0.8);
    border: 1px solid rgba(88, 12, 235, 0.4);
    border-radius: 24px;
    padding: 40px;
    width: 100%;
    max-width: 440px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(10px);
  }
  .auth-header {
    text-align: center;
    margin-bottom: 32px;
  }
  .auth-title {
    font-size: 28px;
    font-weight: 800;
    color: #FFFFFF;
    margin-bottom: 8px;
  }
  .auth-subtitle {
    font-size: 14px;
    color: #B9AFDA;
  }
  .form-group {
    margin-bottom: 20px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .form-group label {
    font-size: 13px;
    font-weight: 700;
    color: #D3CEE8;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  .form-control {
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 12px;
    padding: 14px 16px;
    font-size: 15px;
    color: #FFFFFF;
    outline: none;
    transition: all 0.2s ease;
  }
  .form-control:focus {
    border-color: #00F5A4;
    box-shadow: 0 0 12px rgba(0, 245, 164, 0.2);
  }
  .form-control::placeholder {
    color: rgba(255, 255, 255, 0.3);
  }
  .form-actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
    font-size: 13px;
  }
  .remember-me {
    display: flex;
    align-items: center;
    gap: 8px;
    color: #B9AFDA;
    cursor: pointer;
  }
  .remember-me input {
    accent-color: #00F5A4;
  }
  .forgot-link {
    color: #00F5A4;
    text-decoration: none;
    font-weight: 600;
  }
  .forgot-link:hover {
    text-decoration: underline;
  }
  .btn-auth {
    width: 100%;
    padding: 14px;
    font-size: 16px;
    font-weight: 700;
    border-radius: 12px;
    cursor: pointer;
    border: none;
  }
  .auth-footer {
    text-align: center;
    margin-top: 24px;
    font-size: 14px;
    color: #B9AFDA;
  }
  .auth-footer a {
    color: #00F5A4;
    font-weight: 700;
    text-decoration: none;
  }
  .auth-footer a:hover {
    text-decoration: underline;
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="logo-block">
    <a href="index.html" style="display:flex; align-items:center; gap:12px; text-decoration:none; color:inherit;">
      <img src="digitall-logo-mark.png" class="logo-mark" alt="DigitAll logo">
      <div class="logo-text">
        <div class="word">Digit<span>All</span></div>
        <div class="tag" data-i18n="logo_tag">DIGITAL FOR ALL</div>
      </div>
    </a>
  </div>

  <div class="toggle-group lang" role="group" aria-label="Language Toggle">
    <button id="lang-en" class="active" onclick="setLanguage('en')">EN</button>
    <button id="lang-fr" onclick="setLanguage('fr')">FR</button>
    <button id="lang-mg" onclick="setLanguage('mg')">MG</button>
  </div>
</header>

<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <h1 class="auth-title" data-i18n="login_title">Welcome Back</h1>
      <p class="auth-subtitle" data-i18n="login_subtitle">Sign in to access your financial control center.</p>
    </div>

    <form onsubmit="handleLogin(event)">
      <div class="form-group">
        <label data-i18n="lbl_email">Email Address</label>
        <input type="email" class="form-control" data-i18n-ph="ph_email" placeholder="name@example.com" required>
      </div>

      <div class="form-group">
        <label data-i18n="lbl_password">Password</label>
        <input type="password" class="form-control" data-i18n-ph="ph_password" placeholder="••••••••" required>
      </div>

      <div class="form-actions">
        <label class="remember-me">
          <input type="checkbox">
          <span data-i18n="lbl_remember">Remember me</span>
        </label>
        <a href="#" class="forgot-link" data-i18n="link_forgot">Forgot password?</a>
      </div>

      <button type="submit" class="btn btn-teal btn-auth" data-i18n="btn_login">Sign In</button>
    </form>

    <div class="auth-footer">
      <span data-i18n="no_account">Don't have an account?</span> 
      <a href="signup.html" data-i18n="link_signup">Sign Up</a>
    </div>
  </div>
</div>

<script>
  const translations = {
    fr: {
      logo_tag: "LE NUMÉRIQUE POUR TOUS",
      login_title: "Bon retour",
      login_subtitle: "Connectez-vous pour accéder à votre centre de contrôle financier.",
      lbl_email: "Adresse Email",
      ph_email: "nom@exemple.com",
      lbl_password: "Mot de passe",
      ph_password: "••••••••",
      lbl_remember: "Se souvenir de moi",
      link_forgot: "Mot de passe oublié ?",
      btn_login: "Se Connecter",
      no_account: "Vous n'avez pas de compte ?",
      link_signup: "S'inscrire"
    },
    mg: {
      logo_tag: "DIGITAL HO AN'NY REHETRA",
      login_title: "Tonga soa indray",
      login_subtitle: "Tidiro ny kaontinao hidirana amin'ny ivom-pifehezana ara-bola.",
      lbl_email: "Adiresy Email",
      ph_email: "anarana@ohatra.com",
      lbl_password: "Tenypahatsiarovana",
      ph_password: "••••••••",
      lbl_remember: "Tsarovy izaho",
      link_forgot: "Adino ny tenypahatsiarovana?",
      btn_login: "Hiditra",
      no_account: "Mbola tsy manana kaonty?",
      link_signup: "Hisoratra anarana"
    }
  };

  let currentLang = 'en';
  const originalEnglish = {};
  const originalPlaceholders = {};

  document.addEventListener('DOMContentLoaded', () => {
    document.querySelectorAll('[data-i18n]').forEach(el => {
      originalEnglish[el.getAttribute('data-i18n')] = el.textContent.trim();
    });
    document.querySelectorAll('[data-i18n-ph]').forEach(el => {
      originalPlaceholders[el.getAttribute('data-i18n-ph')] = el.getAttribute('placeholder');
    });
  });

  function setLanguage(lang) {
    currentLang = lang;

    ['en', 'fr', 'mg'].forEach(l => {
      const btn = document.getElementById(`lang-${l}`);
      if (btn) btn.classList.toggle('active', l === lang);
    });

    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      if (lang === 'en') {
        el.textContent = originalEnglish[key];
      } else if (translations[lang] && translations[lang][key]) {
        el.textContent = translations[lang][key];
      }
    });

    document.querySelectorAll('[data-i18n-ph]').forEach(el => {
      const key = el.getAttribute('data-i18n-ph');
      if (lang === 'en') {
        el.setAttribute('placeholder', originalPlaceholders[key]);
      } else if (translations[lang] && translations[lang][key]) {
        el.setAttribute('placeholder', translations[lang][key]);
      }
    });
  }

  function handleLogin(event) {
    event.preventDefault();
    alert(currentLang === 'fr' ? 'Connexion en cours...' : (currentLang === 'mg' ? 'Mampiditra...' : 'Logging in...'));
  }
</script>
</body>
</html>
