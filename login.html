<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | DigitAll</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #070614;
      --card-bg: #100c2a;
      --card-border: rgba(124, 58, 237, 0.25);
      --accent-green: #00ff87;
      --accent-purple: #7c3aed;
      --text-main: #ffffff;
      --text-muted: #94a3b8;
      --input-bg: rgba(255, 255, 255, 0.04);
      --input-border: rgba(255, 255, 255, 0.1);
      --font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-family);
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 40px;
      width: 100%;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }

    .brand-name {
      font-size: 22px;
      font-weight: 800;
      color: #ffffff;
      line-height: 1;
    }

    .brand-name span { color: var(--accent-green); }

    .brand-tagline {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: var(--accent-green);
      margin-top: 3px;
    }

    .lang-switcher {
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 4px;
      gap: 2px;
    }

    .lang-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 14px;
      cursor: pointer;
    }

    .lang-btn.active {
      background: var(--accent-purple);
      color: #ffffff;
    }

    .login-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .login-card {
      width: 100%;
      max-width: 440px;
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 44px 40px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }

    .card-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .card-header h1 {
      font-size: 32px;
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 8px;
    }

    .card-header p {
      font-size: 14px;
      color: var(--text-muted);
    }

    .form-group { margin-bottom: 20px; }

    .form-label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--text-main);
      margin-bottom: 8px;
    }

    .form-input {
      width: 100%;
      padding: 14px 16px;
      background-color: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 12px;
      font-size: 14px;
      font-family: inherit;
      color: var(--text-main);
    }

    .form-input:focus {
      outline: none;
      border-color: var(--accent-purple);
      background-color: rgba(255, 255, 255, 0.07);
    }

    .btn-submit {
      width: 100%;
      padding: 16px;
      margin-top: 10px;
      background-color: var(--accent-green);
      color: #070614;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .form-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 14px;
      color: var(--text-muted);
    }

    .form-footer a {
      color: var(--accent-green);
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <a href="index.html" class="brand-logo">
      <div class="brand-text">
        <div class="brand-name">Digit<span>All</span></div>
        <div class="brand-tagline">DIGITAL FOR ALL</div>
      </div>
    </a>

    <div class="lang-switcher">
      <button type="button" class="lang-btn active" data-lang="EN">EN</button>
      <button type="button" class="lang-btn" data-lang="FR">FR</button>
      <button type="button" class="lang-btn" data-lang="MG">MG</button>
    </div>
  </header>

  <!-- Main Section -->
  <main class="login-wrapper">
    <div class="login-card">
      <div class="card-header">
        <h1 id="txt-title">Welcome Back</h1>
        <p id="txt-subtitle">Sign in to access your financial dashboard.</p>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label id="lbl-email" for="loginEmail" class="form-label">Email Address</label>
          <input type="email" id="loginEmail" class="form-input" placeholder="name@example.com" required />
        </div>

        <div class="form-group">
          <label id="lbl-password" for="loginPassword" class="form-label">Password</label>
          <input type="password" id="loginPassword" class="form-input" placeholder="••••••••" required />
        </div>

        <button type="submit" id="submitBtn" class="btn-submit">Sign In</button>
      </form>

      <div class="form-footer">
        <span id="txt-footer">Don't have an account?</span> <a href="signup.html" id="link-footer">Sign Up</a>
      </div>
    </div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      signInWithEmailAndPassword, 
      signOut 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBc0-yyvbJH7gk5Fmh6-0u0AI6XTyqrdXU",
      authDomain: "digitall-c77d8.firebaseapp.com",
      projectId: "digitall-c77d8",
      storageBucket: "digitall-c77d8.firebasestorage.app",
      messagingSenderId: "922798712588",
      appId: "1:922798712588:web:43235136b5b1bf58168b29"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // Multilingual Translations
    const dictionary = {
      EN: {
        title: "Welcome Back",
        subtitle: "Sign in to access your financial dashboard.",
        email: "EMAIL ADDRESS",
        password: "PASSWORD",
        submit: "Sign In",
        footer: "Don't have an account?",
        link: "Sign Up"
      },
      FR: {
        title: "Bon retour",
        subtitle: "Connectez-vous pour accéder à votre tableau de bord financier.",
        email: "ADRESSE EMAIL",
        password: "MOT DE PASSE",
        submit: "Se connecter",
        footer: "Vous n'avez pas de compte ?",
        link: "S'inscrire"
      },
      MG: {
        title: "Tonga soa indray",
        subtitle: "Midira mba hidirana amin'ny solaitrabe ara-bolanao.",
        email: "ADRESY EMAIL",
        password: "TENY PAHATSIAROVANA",
        submit: "Midira",
        footer: "Tsy mbola manana kaonty?",
        link: "Mamorona Kaonty"
      }
    };

    let currentLang = 'EN';

    function updateLanguage(lang) {
      currentLang = lang;
      const t = dictionary[lang];
      if (!t) return;

      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.classList.toggle('active', btn.getAttribute('data-lang') === lang);
      });

      document.getElementById('txt-title').textContent = t.title;
      document.getElementById('txt-subtitle').textContent = t.subtitle;
      document.getElementById('lbl-email').textContent = t.email;
      document.getElementById('lbl-password').textContent = t.password;
      document.getElementById('submitBtn').textContent = t.submit;
      document.getElementById('txt-footer').textContent = t.footer;
      document.getElementById('link-footer').textContent = t.link;
    }

    document.querySelectorAll('.lang-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        updateLanguage(this.getAttribute('data-lang'));
      });
    });

    // Form Sign-In Handler
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      const submitBtn = document.getElementById('submitBtn');

      submitBtn.disabled = true;
      submitBtn.textContent = "...";

      try {
        // 1. Attempt Sign In with Firebase Auth
        const userCredential = await signInWithEmailAndPassword(auth, email, password);
        const user = userCredential.user;

        // Force explicit token reload to confirm latest emailVerified status
        await user.reload();

        // 2. Strict Check: If email is NOT verified, block entry immediately
        if (!auth.currentUser.emailVerified) {
          alert("Access Denied: Please verify your email address before logging in. Check your inbox for the confirmation link.");
          await signOut(auth);
          submitBtn.disabled = false;
          submitBtn.textContent = dictionary[currentLang].submit;
          return;
        }

        // 3. Email IS verified -> Redirect to Dashboard
        window.location.href = "dashboard.html";

      } catch (error) {
        submitBtn.disabled = false;
        submitBtn.textContent = dictionary[currentLang].submit;
        alert("Sign In Failed: " + error.message);
        console.error("Login Error:", error);
      }
    });
  </script>
</body>
</html>
