<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DigitAll Admin Portal</title>

  <!-- Load EmailJS SDK v4 -->
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #10b981;
      --accent-hover: #059669;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --danger-color: #ef4444;
      --danger-hover: #dc2626;
      --edit-color: #3b82f6;
      --edit-hover: #2563eb;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }

    /* Login Screen */
    #loginScreen { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 32px; width: 100%; max-width: 400px; margin-top: 80px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
    #loginScreen h2 { margin-bottom: 20px; text-align: center; color: var(--text-main); }
    .input-group { margin-bottom: 16px; position: relative; }
    .input-group label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 6px; }
    input[type="email"], input[type="password"], input[type="text"], input[type="number"], select {
      width: 100%; padding: 10px 14px; background: #0f172a; border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-main); font-size: 14px; outline: none; transition: border-color 0.2s;
    }
    input:focus, select:focus { border-color: var(--accent-color); }
    .btn-primary { width: 100%; padding: 12px; background: var(--accent-color); color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    .btn-primary:hover { background: var(--accent-hover); }

    /* Dashboard Layout */
    #adminDashboard { display: none; width: 100%; max-width: 1100px; margin-top: 10px; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid var(--border-color); }
    header h1 { font-size: 24px; }
    .btn-logout { background: transparent; border: 1px solid var(--border-color); color: var(--text-muted); padding: 8px 16px; border-radius: 6px; cursor: pointer; }
    .btn-logout:hover { color: var(--text-main); border-color: var(--text-muted); }

    /* Navigation Tabs */
    .tab-navigation { display: flex; gap: 8px; margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
    .tab-btn { background: transparent; border: none; color: var(--text-muted); padding: 10px 18px; font-size: 15px; font-weight: 600; cursor: pointer; border-radius: 8px; transition: all 0.2s; }
    .tab-btn:hover { color: var(--text-main); background: rgba(255, 255, 255, 0.05); }
    .tab-btn.active { color: var(--text-main); background: var(--card-bg); border: 1px solid var(--border-color); }

    /* Tab Sections */
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Section Cards */
    .dashboard-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 24px; margin-bottom: 24px; }
    .card-header-flex { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 16px; }
    .dashboard-card h2 { font-size: 18px; color: var(--text-main); }
    
    .search-input { max-width: 280px; padding: 8px 12px; font-size: 13px; }

    /* Tables */
    .table-container { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
    th { background: #0f172a; color: var(--text-muted); padding: 12px; font-weight: 600; border-bottom: 1px solid var(--border-color); }
    td { padding: 14px 12px; border-bottom: 1px solid var(--border-color); color: var(--text-main); }
    tr.user-main-row { cursor: pointer; transition: background 0.2s; }
    tr.user-main-row:hover { background-color: rgba(255,255,255,0.03); }

    .user-details-row { display: none; background: #0f172a; }
    .user-details-row.active { display: table-row; }
    .user-details-container { padding: 16px; font-size: 13px; line-height: 1.6; border-left: 3px solid var(--accent-color); margin: 4px 0; }
    .user-details-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
    .user-detail-item { color: var(--text-muted); }
    .user-detail-item span { color: var(--text-main); font-weight: 600; display: block; margin-top: 2px; word-break: break-all; }

    .badge { padding: 4px 8px; border-radius: 12px; font-size: 12px; background: rgba(16, 185, 129, 0.1); color: var(--accent-color); display: inline-block; }
    .badge-admin { background: rgba(59, 130, 246, 0.15); color: #60a5fa; }
    .badge-count { background: #0f172a; color: var(--text-muted); border: 1px solid var(--border-color); padding: 2px 10px; border-radius: 20px; font-size: 13px; }
    .btn-edit { background: var(--edit-color); color: white; border: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; }
    .btn-edit:hover { background: var(--edit-hover); }

    /* Modal */
    #editModal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); align-items: center; justify-content: center; z-index: 1000; }
    .modal-content { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 24px; width: 100%; max-width: 400px; }
    .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
    .btn-cancel { background: transparent; border: 1px solid var(--border-color); color: var(--text-muted); width: 100%; padding: 10px; border-radius: 8px; cursor: pointer; }
  </style>
</head>
<body>

  <!-- 1. Admin Login Screen -->
  <div id="loginScreen">
    <h2>DigitAll Admin</h2>
    <div class="input-group">
      <label>Email Address</label>
      <input type="email" id="emailInput" placeholder="admin@digitall.com" required>
    </div>
    <div class="input-group">
      <label>Password</label>
      <input type="password" id="passwordInput" placeholder="••••••••" required>
    </div>
    <button class="btn-primary" onclick="handleLogin()">Sign In to Dashboard</button>
  </div>

  <!-- 2. Admin Dashboard -->
  <div id="adminDashboard">
    <header>
      <h1>DigitAll Control Panel</h1>
      <button class="btn-logout" onclick="handleLogout()">Sign Out</button>
    </header>

    <!-- Navigation Tabs -->
    <div class="tab-navigation">
      <button class="tab-btn active" onclick="switchTab('promoTab', this)">Promo Codes</button>
      <button class="tab-btn" onclick="switchTab('usersTab', this)">Registered Users</button>
      <button class="tab-btn" onclick="switchTab('emailTab', this)">Send Email</button>
    </div>

    <!-- TAB 1: Promo Codes -->
    <div id="promoTab" class="tab-content active">
      <div class="dashboard-card">
        <h2>Create New Promo Code</h2>
        <div style="display: flex; flex-direction: column; gap: 12px; margin-top: 15px;">
          <input type="text" id="newPromoCode" placeholder="Code (e.g. SUMMER50)" />
          
          <select id="newPromoType">
            <option value="percentage">Percentage (%)</option>
            <option value="fixed">Fixed Amount / Money</option>
            <option value="credits">Bonus Credits</option>
          </select>

          <input type="number" id="newPromoValue" placeholder="Value (e.g. 20 for 20%)" />
          <input type="number" id="newPromoMaxUses" placeholder="Max Uses (e.g. 100)" value="100" />

          <button id="btnCreatePromo" class="btn-primary" style="background: var(--accent-color);">Create Promo Code</button>
        </div>
        <div id="adminPromoMessage" style="margin-top: 10px; font-weight: 700; font-size: 14px;"></div>
      </div>

      <!-- Existing Promos Table -->
      <div class="dashboard-card">
        <div class="card-header-flex">
          <h2>Active Promo Codes <span id="promoCounter" class="badge-count">0</span></h2>
          <input type="text" id="searchPromoInput" class="search-input" placeholder="Search promos..." onkeyup="filterPromos()">
        </div>
        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>Code</th>
                <th>Type / Value</th>
                <th>Current Uses</th>
                <th>Max Uses</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="promoTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- TAB 2: Registered Users Table -->
    <div id="usersTab" class="tab-content">
      <div class="dashboard-card">
        <div class="card-header-flex">
          <div>
            <h2>Registered Accounts <span id="userCounter" class="badge-count">0</span></h2>
            <p style="font-size: 13px; color: var(--text-muted); margin-top: 4px;">Tap on any user's name to toggle their details.</p>
          </div>
          <input type="text" id="searchUserInput" class="search-input" placeholder="Search users or email..." onkeyup="filterUsers()">
        </div>
        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>Full Name</th>
              </tr>
            </thead>
            <tbody id="usersTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- TAB 3: Send Email -->
    <div id="emailTab" class="tab-content">
      <div class="dashboard-card">
        <h2>Send Promo Code Email</h2>
        
        <div class="input-group">
          <label>Recipient Name</label>
          <input type="text" id="admin-user-name" placeholder="Start typing name..." autocomplete="off">
        </div>

        <div class="input-group">
          <label>Recipient Email Address</label>
          <input type="email" id="admin-user-email" placeholder="Start typing email..." required autocomplete="off">
        </div>

        <div class="input-group">
          <label>Promo Code to Send</label>
          <input type="text" id="admin-promo-code" placeholder="WELCOME10">
        </div>

        <button id="send-promo-btn" type="button" class="btn-primary" style="margin-top: 10px;">Send Promo Code</button>
      </div>
    </div>
  </div>

  <!-- 3. Edit Promo Modal -->
  <div id="editModal">
    <div class="modal-content">
      <h3 style="margin-bottom: 16px;">Edit Promo Code: <span id="editModalCodeTitle"></span></h3>
      <input type="hidden" id="editModalCode">
      
      <div class="input-group">
        <label>Discount Type</label>
        <select id="editModalType">
          <option value="percentage">Percentage (%)</option>
          <option value="fixed">Fixed Amount / Money</option>
          <option value="credits">Store Credits</option>
        </select>
      </div>
      <div class="input-group">
        <label>Discount Value</label>
        <input type="number" id="editModalValue" required>
      </div>
      <div class="input-group">
        <label>Max Uses</label>
        <input type="number" id="editModalMaxUses" required>
      </div>

      <div class="modal-actions">
        <button class="btn-primary" onclick="savePromoEdit()">Save Changes</button>
        <button class="btn-cancel" onclick="closeEditModal()">Cancel</button>
      </div>
    </div>
  </div>

  <!-- 4. Load admin.js as a module -->
  <script type="module" src="admin.js"></script>
</body>
</html>
