<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digitall - Admin Dashboard</title>
  <!-- EmailJS SDK -->
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --danger: #ef4444;
      --success: #00ff87;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* Login Screen */
    #loginScreen {
      background: var(--card-bg);
      padding: 30px;
      border-radius: 12px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      border: 1px solid var(--border);
    }

    #loginScreen h2 {
      margin-bottom: 20px;
      font-size: 24px;
      text-align: center;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      color: var(--text-muted);
    }

    .form-group input, .form-group select {
      width: 100%;
      padding: 10px 14px;
      background: var(--bg-color);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-main);
      font-size: 14px;
    }

    .btn-primary {
      width: 100%;
      padding: 12px;
      background: var(--accent);
      color: #0f172a;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    /* Admin Dashboard */
    #adminDashboard {
      display: none;
      width: 100%;
      max-width: 1100px;
      background: var(--card-bg);
      border-radius: 12px;
      padding: 24px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }

    .dashboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
    }

    .btn-logout {
      background: transparent;
      border: 1px solid var(--danger);
      color: var(--danger);
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
    }

    .btn-logout:hover {
      background: var(--danger);
      color: white;
    }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .tab-btn {
      padding: 10px 20px;
      background: var(--bg-color);
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 6px;
      cursor: pointer;
    }

    .tab-btn.active {
      background: var(--accent);
      color: #0f172a;
      font-weight: 600;
      border-color: var(--accent);
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* Tables & Grid */
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
    }

    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }

    th {
      color: var(--text-muted);
      font-size: 13px;
    }

    .user-main-row {
      cursor: pointer;
    }

    .user-main-row:hover {
      background: rgba(255,255,255,0.02);
    }

    .user-details-row {
      display: none;
      background: rgba(0,0,0,0.2);
    }

    .user-details-row.active {
      display: table-row;
    }

    .user-details-container {
      padding: 16px;
    }

    .user-details-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
    }

    .user-detail-item {
      font-size: 13px;
      color: var(--text-muted);
    }

    .user-detail-item span {
      display: block;
      color: var(--text-main);
      font-weight: 500;
      margin-top: 2px;
    }

    .badge {
      display: inline-block;
      padding: 4px 8px;
      background: rgba(56, 189, 248, 0.1);
      color: var(--accent);
      border-radius: 4px;
      font-size: 12px;
    }

    .badge-admin {
      background: rgba(0, 255, 135, 0.1);
      color: var(--success);
    }

    /* Autocomplete dropdown */
    .autocomplete-wrapper {
      position: relative;
    }

    .suggestions-list {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: var(--bg-color);
      border: 1px solid var(--border);
      border-radius: 6px;
      list-style: none;
      max-height: 150px;
      overflow-y: auto;
      display: none;
      z-index: 10;
    }

    .suggestions-list.active {
      display: block;
    }

    .autocomplete-item {
      padding: 10px;
      cursor: pointer;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
    }

    .autocomplete-item:hover {
      background: rgba(56, 189, 248, 0.1);
    }

    .autocomplete-item span {
      display: block;
      color: var(--text-muted);
      font-size: 11px;
    }

    /* Modal */
    #editModal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .modal-box {
      background: var(--card-bg);
      padding: 24px;
      border-radius: 12px;
      width: 100%;
      max-width: 400px;
      border: 1px solid var(--border);
    }

    .btn-edit {
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }

    .btn-edit:hover {
      background: var(--accent);
      color: #0f172a;
    }
  </style>
</head>
<body>

  <!-- Login Screen -->
  <div id="loginScreen">
    <h2>Admin Login</h2>
    <div class="form-group">
      <label for="emailInput">Email Address</label>
      <input type="email" id="emailInput" placeholder="admin@digitall.com">
    </div>
    <div class="form-group">
      <label for="passwordInput">Password</label>
      <input type="password" id="passwordInput" placeholder="••••••••">
    </div>
    <button type="button" id="btnLogin" class="btn-primary">Sign In to Dashboard</button>
  </div>

  <!-- Admin Dashboard -->
  <div id="adminDashboard">
    <div class="dashboard-header">
      <h2>Digitall Control Center</h2>
      <button id="btnLogout" class="btn-logout">Sign Out</button>
    </div>

    <div class="tabs">
      <button class="tab-btn active" onclick="window.switchTab('usersTab', this)">Users (<span id="userCounter">0</span>)</button>
      <button class="tab-btn" onclick="window.switchTab('promosTab', this)">Promo Codes (<span id="promoCounter">0</span>)</button>
      <button class="tab-btn" id="emailTab" onclick="window.switchTab('emailsTab', this)">Dispatch Promo</button>
    </div>

    <!-- Users Tab -->
    <div id="usersTab" class="tab-content active">
      <div class="form-group" style="margin-bottom: 16px;">
        <input type="text" id="searchUserInput" placeholder="Search users by name or email..." oninput="window.filterUsers()">
      </div>
      <table>
        <thead>
          <tr>
            <th>Registered Accounts</th>
          </tr>
        </thead>
        <tbody id="usersTableBody">
          <!-- Dynamic User Rows -->
        </tbody>
      </table>
    </div>

    <!-- Promo Codes Tab -->
    <div id="promosTab" class="tab-content">
      <div style="background: var(--bg-color); padding: 16px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 20px;">
        <h3 style="font-size: 16px; margin-bottom: 12px;">Create New Promo Code</h3>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
          <div class="form-group">
            <label>Code Name</label>
            <input type="text" id="newPromoCode" placeholder="e.g. WELCOME10">
          </div>
          <div class="form-group">
            <label>Type</label>
            <select id="newPromoType">
              <option value="percentage">Percentage (%)</option>
              <option value="fixed">Fixed ($)</option>
              <option value="credits">Credits</option>
            </select>
          </div>
          <div class="form-group">
            <label>Value</label>
            <input type="number" id="newPromoValue" placeholder="10">
          </div>
          <div class="form-group">
            <label>Max Uses (0 for unlimited)</label>
            <input type="number" id="newPromoMaxUses" placeholder="100" value="100">
          </div>
        </div>
        <button type="button" id="btnCreatePromo" class="btn-primary" style="margin-top: 8px;">Create Promo Code</button>
        <div id="adminPromoMessage" style="margin-top: 8px; font-size: 13px;"></div>
      </div>

      <div class="form-group" style="margin-bottom: 16px;">
        <input type="text" id="searchPromoInput" placeholder="Search promo codes..." oninput="window.filterPromos()">
      </div>
      <table>
        <thead>
          <tr>
            <th>Code</th>
            <th>Value</th>
            <th>Current Uses</th>
            <th>Max Uses</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="promoTableBody">
          <!-- Dynamic Promo Rows -->
        </tbody>
      </table>
    </div>

    <!-- Dispatch Email Tab -->
    <div id="emailsTab" class="tab-content">
      <div style="max-width: 500px;">
        <h3 style="font-size: 16px; margin-bottom: 16px;">Send Promo Code via Email</h3>
        <div class="form-group autocomplete-wrapper">
          <label>Recipient Name</label>
          <input type="text" id="admin-user-name" placeholder="Type or select user name...">
          <ul id="name-suggestions" class="suggestions-list"></ul>
        </div>
        <div class="form-group autocomplete-wrapper">
          <label>Recipient Email</label>
          <input type="email" id="admin-user-email" placeholder="user@example.com">
          <ul id="email-suggestions" class="suggestions-list"></ul>
        </div>
        <div class="form-group">
          <label>Promo Code to Include</label>
          <input type="text" id="admin-promo-code" placeholder="e.g. SPECIAL20">
        </div>
        <button type="button" id="send-promo-btn" class="btn-primary">Send Email</button>
      </div>
    </div>
  </div>

  <!-- Edit Modal -->
  <div id="editModal">
    <div class="modal-box">
      <h3 style="font-size: 18px; margin-bottom: 16px;">Edit Promo: <span id="editModalCodeTitle"></span></h3>
      <input type="hidden" id="editModalCode">
      <div class="form-group">
        <label>Type</label>
        <select id="editModalType">
          <option value="percentage">Percentage (%)</option>
          <option value="fixed">Fixed ($)</option>
          <option value="credits">Credits</option>
        </select>
      </div>
      <div class="form-group">
        <label>Value</label>
        <input type="number" id="editModalValue">
      </div>
      <div class="form-group">
        <label>Max Uses</label>
        <input type="number" id="editModalMaxUses">
      </div>
      <div style="display: flex; gap: 10px; margin-top: 20px;">
        <button type="button" class="btn-primary" onclick="window.savePromoEdit()">Save Changes</button>
        <button type="button" class="btn-logout" style="flex: 1;" onclick="window.closeEditModal()">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Main Script Module -->
  <script type="module" src="admin.js"></script>
</body>
</html>
