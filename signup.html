<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DigitAll | Sign Up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Stack+Sans+Notch:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0518;
    --card:#160b38;
    --card-border: rgba(255,255,255,0.08);
    --purple:#580CEB;
    --teal:#00F5A4;
    --red:#FF4D5E;
    --text:#FFFFFF;
    --text-dim:#B9AFDA;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-display: "Stack Sans Notch", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  *{ box-sizing: border-box; }
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background: radial-gradient(1200px 600px at 20% -10%, #1a0f45 0%, var(--bg) 55%) fixed, var(--bg);
    font-family: var(--font); color: var(--text); padding: 24px;
  }
  .card{
    width: 100%; max-width: 420px; background: var(--card); border: 1px solid var(--purple);
    border-radius: 24px; padding: 40px 36px;
  }
  .logo-row{ display:flex; align-items:center; gap:10px; margin-bottom: 28px; }
  .logo-row .word{ font-family: var(--font-display); font-weight:800; font-size: 20px; }
  .logo-row .word span{ color: var(--teal); }
  h1{ font-family: var(--font-display); font-size: 24px; margin: 0 0 6px; }
  p.sub{ color: var(--text-dim); font-size: 14px; margin: 0 0 28px; }
  label{ display:block; font-size: 13px; font-weight: 700; margin-bottom: 6px; color: var(--text-dim); }
  input{
    width:100%; background: rgba(255,255,255,0.04); border: 1px solid var(--card-border);
    color: var(--text); border-radius: 12px; padding: 13px 14px; font-size: 15px; margin-bottom: 18px;
    font-family: var(--font);
  }
  input:focus{ outline:none; border-color: var(--teal); }
  button{
    width:100%; background: var(--teal); color:#04160f; border:none; border-radius: 999px;
    padding: 14px; font-size: 15px; font-weight: 800; cursor:pointer; font-family: var(--font);
    transition: opacity .15s ease;
  }
  button:hover{ opacity: 0.9; }
  button:disabled{ opacity: 0.5; cursor: not-allowed; }
  .msg{ margin-top: 18px; font-size: 14px; line-height: 1.5; padding: 12px 14px; border-radius: 10px; display:none; }
  .msg.success{ display:block; background: rgba(0,245,164,0.1); border: 1px solid rgba(0,245,164,0.35); color: var(--teal); }
  .msg.error{ display:block; background: rgba(255,77,94,0.1); border: 1px solid rgba(255,77,94,0.35); color: var(--red); }
  .resend{ margin-top: 14px; text-align:center; font-size: 13px; color: var(--text-dim); }
  .resend button{ background: none; border: none; color: var(--teal); font-weight: 700; text-decoration: underline; width: auto; padding: 0; font-size: 13px; }
</style>
</head>
<body>

<div class="card">
  <div class="logo-row">
    <div class="word">Digit<span>All</span></div>
  </div>

  <h1>Create your account</h1>
  <p class="sub">Sign up with your email — we'll send a verification link right away.</p>

  <form id="signup-form">
    <label for="email">Email</label>
    <input type="email" id="email" required placeholder="you@example.com">

    <label for="password">Password</label>
    <input type="password" id="password" required minlength="6" placeholder="At least 6 characters">

    <button type="submit" id="submit-btn">Sign Up</button>
  </form>

  <div class="msg" id="msg"></div>

  <div class="resend" id="resend-row" style="display:none;">
    Didn't get it? <button id="resend-btn">Resend verification email</button>
  </div>
</div>

<!-- ============================================================= -->
<!-- Firebase SDK (loaded from Google's CDN, no install needed)    -->
<!-- ============================================================= -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getAuth,
    createUserWithEmailAndPassword,
    sendEmailVerification
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  // ============================================================
  // ⚠️ REQUIRED: paste YOUR Firebase project's config here.
  // Get this from: Firebase Console → Project Settings → General
  // → "Your apps" → Web app → SDK setup and configuration.
  // Nothing will send until this is filled in with your real project.
  // ============================================================
  const firebaseConfig = {
    apiKey: "AIzaSyBc0-yyvbJH7gk5Fmh6-0u0AI6XTyqrdXU",
    authDomain: "digitall-c77d8.firebaseapp.com",
    projectId: "digitall-c77d8",
    storageBucket: "digitall-c77d8.firebasestorage.app",
    messagingSenderId: "922798712588",
    appId: "1:922798712588:web:43235136b5b1bf58168b29"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  const form = document.getElementById("signup-form");
  const msgEl = document.getElementById("msg");
  const submitBtn = document.getElementById("submit-btn");
  const resendRow = document.getElementById("resend-row");
  const resendBtn = document.getElementById("resend-btn");

  let lastUser = null;

  function showMessage(text, type) {
    msgEl.textContent = text;
    msgEl.className = "msg " + type;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    submitBtn.disabled = true;
    submitBtn.textContent = "Creating account...";

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    try {
      const userCredential = await createUserWithEmailAndPassword(auth, email, password);
      lastUser = userCredential.user;
      await sendEmailVerification(lastUser);

      showMessage(
        `We sent a verification link to ${email}. Check your inbox (and spam folder) and click it to activate your account.`,
        "success"
      );
      resendRow.style.display = "block";
      form.reset();
    } catch (err) {
      let friendly = "Something went wrong. Please try again.";
      if (err.code === "auth/email-already-in-use") friendly = "That email is already registered. Try logging in instead.";
      if (err.code === "auth/invalid-email") friendly = "That email address doesn't look valid.";
      if (err.code === "auth/weak-password") friendly = "Password should be at least 6 characters.";
      showMessage(friendly, "error");
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "Sign Up";
    }
  });

  resendBtn.addEventListener("click", async () => {
    if (!lastUser) return;
    resendBtn.disabled = true;
    resendBtn.textContent = "Sending...";
    try {
      await sendEmailVerification(lastUser);
      showMessage("Verification email resent — check your inbox.", "success");
    } catch (err) {
      showMessage("Couldn't resend right now. Please wait a moment and try again.", "error");
    } finally {
      resendBtn.disabled = false;
      resendBtn.textContent = "Resend verification email";
    }
  });
</script>

</body>
</html>
