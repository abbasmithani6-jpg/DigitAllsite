    let activeDiscount = 0;
    let selectedCycle = 'monthly';

    const AR_TO_CREDITS_RATIO = 2.5;

    let userCredits = 0;

    let userPlanTier = "None";

    document.addEventListener('DOMContentLoaded', () => {
      updateDashboardMetrics();
      updateAllPrices();
    });

    onAuthStateChanged(auth, (user) => {
      if (user) {
        document.getElementById('userEmailDisplay').textContent = user.email;
        updateDashboardMetrics();
      } else {
        setTimeout(() => {
          if (!auth.currentUser) {
            window.location.href = "login.html";
          }
        }, 1200);
      }
    });

    function updateDashboardMetrics() {
      document.getElementById('userCreditDisplay').textContent = `${userCredits} Credits`;
      document.getElementById('userIncomeDisplay').textContent = userMonthlyAllocation;
      document.getElementById('userPlanTierDisplay').textContent = userPlanTier;
      
      const transferSec = document.getElementById('familyTransferSection');
      if (transferSec) {
        transferSec.style.display = isAdultFamilyMember ? 'flex' : 'none';
      }
    }

    document.getElementById('btnSendTransfer')?.addEventListener('click', () => {
      const target = document.getElementById('transferTargetInput').value.trim();
      const amt = parseInt(document.getElementById('transferAmountInput').value) || 0;
      const msg = document.getElementById('transferMsg');

      if (!target) {
        msg.style.color = "#ef4444";
        msg.textContent = "Please specify target child account ID.";
        return;
      }
      if (amt <= 0 || amt > userCredits) {
        msg.style.color = "#ef4444";
        msg.textContent = "Invalid credit amount selection.";
        return;
      }

      userCredits -= amt;
      updateDashboardMetrics();
      msg.style.color = "#00ff87";
      msg.textContent = `Successfully transferred ${amt} credits to ${target}!`;
      document.getElementById('transferTargetInput').value = '';
    });

    function getAdjustedMonthlyBase(baseMonthly) {
      if (selectedCycle === 'weekly') {
        return (baseMonthly / 4) * 1.15;
      } else if (selectedCycle === 'yearly') {
        return baseMonthly * 12;
      }
      return baseMonthly;
    }

    window.calculateFamilyPrice = function() {
      const adults = parseInt(document.getElementById('family-adults').value) || 0;
      const kids = parseInt(document.getElementById('family-kids').value) || 0;
      const baseMonthly = 200 + (adults * 120) + (kids * 75);
      renderPrice('price-family', 'credit-price-fam', baseMonthly);
    };

    window.calculateFamilyPremiumPrice = function() {
      const adults = parseInt(document.getElementById('fam-prem-adults').value) || 0;
      const kids = parseInt(document.getElementById('fam-prem-kids').value) || 0;
      const baseMonthly = 300 + (adults * 400) + (kids * 250);
      renderPrice('price-family-premium', 'credit-price-famprem', baseMonthly);
    };

    function renderPrice(elementId, creditElementId, baseMonthly) {
      const cyclePrice = getAdjustedMonthlyBase(baseMonthly);
      const finalPrice = activeDiscount > 0 ? cyclePrice * (1 - activeDiscount / 100) : cyclePrice;
      const target = document.getElementById(elementId);
      const creditTarget = document.getElementById(creditElementId);
      
      const roundedPrice = Math.round(finalPrice);
      const roundedOriginal = Math.round(cyclePrice);
      const roundedCredits = Math.round(finalPrice * AR_TO_CREDITS_RATIO);

      let priceDisplay = `${roundedPrice} AR`;
      if (selectedCycle === 'weekly') {
        const fullYearCost = Math.round(cyclePrice * 52);
        priceDisplay += ` <span style="font-size: 11px; opacity: 0.7;">(Full 52-week cost: ${fullYearCost} AR)</span>`;
      } else if (selectedCycle === 'monthly') {
        const fullYearCost = Math.round(cyclePrice * 12);
        priceDisplay += ` <span style="font-size: 11px; opacity: 0.7;">(12-month year cost: ${fullYearCost} AR)</span>`;
      } else if (selectedCycle === 'yearly') {
        priceDisplay += ` <span style="font-size: 11px; opacity: 0.7;">(Annual billing package)</span>`;
      }

      if (activeDiscount > 0) {
        target.innerHTML = `<span style="text-decoration: line-through; opacity: 0.5; font-size: 16px; margin-right: 6px;">${roundedOriginal} AR</span>${priceDisplay}`;
      } else {
        target.innerHTML = priceDisplay;
      }

      creditTarget.textContent = `Or ${roundedCredits.toLocaleString()} Credits`;
    }

    function updateAllPrices() {
      renderPrice('price-standard', 'credit-price-std', 200);
      renderPrice('price-plus', 'credit-price-plus', 500);
      renderPrice('price-pro', 'credit-price-pro', 1200);
      calculateFamilyPrice();
      calculateFamilyPremiumPrice();
      updateCycleSubtexts();
    }

    function updateCycleSubtexts() {
      const cycleTexts = {
        EN: { weekly: "Per week", monthly: "Per month", yearly: "Per year" },
        FR: { weekly: "Par semaine", monthly: "Par mois", yearly: "Par an" },
        MG: { weekly: "Isan-kerinandro", monthly: "Isam-bolana", yearly: "Isan-taona" }
      };
      
      const txt = cycleTexts[currentLang][selectedCycle];
      document.querySelectorAll('.cycle-subtext').forEach(el => el.textContent = txt);
    }

    document.querySelectorAll('.cycle-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.cycle-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedCycle = btn.getAttribute('data-cycle');
        updateAllPrices();
      });
    });

    const navButtons = document.querySelectorAll('.nav-btn');
    const tabContents = document.querySelectorAll('.tab-content');

    function switchTab(targetTab) {
      navButtons.forEach(b => b.classList.toggle('active', b.getAttribute('data-tab') === targetTab));
      tabContents.forEach(c => c.classList.toggle('active', c.id === `tab-${targetTab}`));
    }

    navButtons.forEach(btn => {
      btn.addEventListener('click', () => switchTab(btn.getAttribute('data-tab')));
    });

    document.getElementById('btnApplyPromo').addEventListener('click', async () => {
      const codeInput = document.getElementById('promoCodeInput').value.trim().toUpperCase();
      const msg = document.getElementById('promoMessage');

      if (!codeInput) {
        msg.style.color = "#ef4444";
        msg.textContent = dictionary[currentLang].promoErrEmpty;
        return;
      }

      try {
        const promoRef = doc(db, "promocodes", codeInput);
        const promoSnap = await getDoc(promoRef);

        if (promoSnap.exists()) {
          const data = promoSnap.data();
          const parsedDiscount = Number(data.discount);
          activeDiscount = isNaN(parsedDiscount) ? 0 : parsedDiscount;

          msg.style.color = "#00ff87";
          msg.textContent = `${dictionary[currentLang].promoSuccess} ${activeDiscount}%`;
          updateAllPrices();
        } else {
          const staticCodes = { "DIGITALL20": 20, "WELCOME10": 10, "PRO50": 50 };
          if (staticCodes[codeInput] !== undefined) {
            activeDiscount = staticCodes[codeInput];
            msg.style.color = "#00ff87";
            msg.textContent = `${dictionary[currentLang].promoSuccess} ${activeDiscount}%`;
            updateAllPrices();
          } else {
            activeDiscount = 0;
            msg.style.color = "#ef4444";
            msg.textContent = dictionary[currentLang].promoInvalid;
            updateAllPrices();
          }
        }
      } catch (err) {
        console.error("Promo code fetch error:", err);
        const staticCodes = { "DIGITALL20": 20, "WELCOME10": 10, "PRO50": 50 };
        if (staticCodes[codeInput] !== undefined) {
          activeDiscount = staticCodes[codeInput];
          msg.style.color = "#00ff87";
          msg.textContent = `${dictionary[currentLang].promoSuccess} ${activeDiscount}%`;
          updateAllPrices();
        } else {
          activeDiscount = 0;
          msg.style.color = "#ef4444";
          msg.textContent = dictionary[currentLang].promoInvalid;
          updateAllPrices();
        }
      }
    });

    window.toggleTheme = function() {
      const themeToggle = document.getElementById('themeToggle');
      if (themeToggle.checked) {
        document.body.classList.remove('light-mode');
        localStorage.setItem('digitall_theme', 'dark');
      } else {
        document.body.classList.add('light-mode');
        localStorage.setItem('digitall_theme', 'light');
      }
    };

    if (localStorage.getItem('digitall_theme') === 'light') {
      document.body.classList.add('light-mode');
      document.getElementById('themeToggle').checked = false;
    } else {
      document.body.classList.remove('light-mode');

    const aiForm = document.getElementById('aiForm');
    const aiInput = document.getElementById('aiInput');
    const chatBox = document.getElementById('chatBox');

    aiForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = aiInput.value.trim();
      if (!text) return;

      const userDiv = document.createElement('div');
      userDiv.className = 'chat-msg user';
      userDiv.textContent = text;
      chatBox.appendChild(userDiv);
      aiInput.value = '';
      chatBox.scrollTop = chatBox.scrollHeight;

      const botDiv = document.createElement('div');
      botDiv.className = 'chat-msg bot';
      botDiv.textContent = "...";
      chatBox.appendChild(botDiv);
      chatBox.scrollTop = chatBox.scrollHeight;

      try {
        const response = await fetch(GEMINI_API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [
              {
                role: "user",
                parts: [{ text: `You are the AI Assistant for DigitAll, a service platform. Provide concise, expert automated analytics or support responses. User query: ${text}` }]
              }
            ]
          })
        });

        const data = await response.json();

        if (data.candidates && data.candidates[0].content.parts[0].text) {
          botDiv.textContent = data.candidates[0].content.parts[0].text;
        } else {
          botDiv.textContent = "Sorry, I couldn't generate a proper response.";
        }
      } catch (err) {
        console.error("Gemini API Error:", err);
        botDiv.textContent = "Unable to connect to AI Assistant. Please check your API key.";
      }

      chatBox.scrollTop = chatBox.scrollHeight;
    });

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await signOut(auth);
      window.location.href = "login.html";
    });
  </script>
